[project]
name = "thermogeist"
version = "0.0.0"
description = "Calm, understandable radiator control for Home Assistant."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Martin Schmiedel" }]
requires-python = ">=3.14"
dependencies = []

[project.optional-dependencies]
dev = ["pytest-homeassistant-custom-component==0.13.375", "ruff>=0.14"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "DTZ", "PTH"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["DTZ001"]
